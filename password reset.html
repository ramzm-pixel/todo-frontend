<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
    >
</head>
<body>
    <header class="container">
        <h3>Todo List</h3>
    </header>
    <main class="container">
        <article 
            id="message-box" 
            style="display: none; color: white; margin-bottom: 1rem; padding: 0.75rem 1rem;" 
            role="alert"
        >
            <span id="message-text"></span>
        </article>
        <div id="reset-password-form" style="margin-bottom: 1.5rem;" data-testid="reset-password-form">
            <input type="password" id="reset-new-password" name="new-password" placeholder="Enter Your New Password" autocomplete="new-password" required data-testid="reset-new-password">
            <input type="password" id="reset-confirm-password" name="confirm-password" placeholder="Confirm Your New Password" autocomplete="new-password" required data-testid="reset-confirm-password">
            <button type="button" id="reset-password-button" style="width: 100%;">Reset Password</button>
        </div>
        <a href="index.html">Log In</a>
    </main>
    <script src="api.js"></script>
    <script src="password reset.js"></script>
</body>
</html>
