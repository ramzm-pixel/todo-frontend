<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
    >
</head>
<body>
    <header class="container">
        <h3>Todo List</h3>
    </header>
    <main class="container">
        <article 
            id="message-box" 
            style="display: none; color: white; margin-bottom: 1rem; padding: 0.75rem 1rem;" 
            role="alert"
        >
            <span id="message-text"></span>
        </article>
        <div id="forgot-password-form" style="margin-bottom: 1.5rem;" data-testid="forgot-password-form">
            <input type="email" id="forgot-password-email" name="email" placeholder="Enter the email associated with your account" autocomplete="email" autocapitalize="off" autocorrect="off" required data-testid="forgot-password-email">
            <button type="button" id="forgot-password-button" style="width: 100%;">Send Reset Link</button>
        </div>
        <div class="grid" style="
            width: 100vw;
            margin-left: calc(50% - 50vw);
            padding-left: 0;
            padding-right: 0;
            align-items: center;
            text-align: center;
        ">
            <a href="index.html">Log In</a>
            <p style="margin: 0;">OR</p>
            <a href="create account.html">Create An Account</a>
        </div>
    </main>
    <script src="api.js"></script>
    <script src="forgot password.js"></script>
</body>
</html>
